services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: valrify
      POSTGRES_USER: valrify
      POSTGRES_PASSWORD: valrify_dev
    ports:
      - "5434:5432"
    volumes:
      - valrify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valrify -d valrify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  valrify_postgres_data:
